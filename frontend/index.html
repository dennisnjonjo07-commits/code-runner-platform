<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeRunner - Multi-Language Code Execution Platform</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app" class="app-container">
        <div class="sidebar">
            <div class="logo">CodeRunner</div>
            <nav class="nav-menu">
                <div class="nav-item active" data-page="dashboard">Dashboard</div>
                <div class="nav-item" data-page="projects">My Projects</div>
                <div class="nav-item" data-page="new-project">New Project</div>
                <div class="nav-item" data-page="logout">Logout</div>
            </nav>
        </div>

        <div class="main-content">
            <!-- Login Page -->
            <div id="login-page" class="page active">
                <div class="auth-container">
                    <h1>CodeRunner</h1>
                    <form id="login-form">
                        <input type="email" placeholder="Email" required>
                        <input type="password" placeholder="Password" required>
                        <button type="submit">Login</button>
                        <p>Don't have an account? <a href="#" onclick="switchToRegister()">Sign Up</a></p>
                    </form>
                </div>
            </div>

            <!-- Register Page -->
            <div id="register-page" class="page">
                <div class="auth-container">
                    <h1>Create Account</h1>
                    <form id="register-form">
                        <input type="text" placeholder="Username" required>
                        <input type="email" placeholder="Email" required>
                        <input type="password" placeholder="Password" required>
                        <button type="submit">Sign Up</button>
                        <p>Already have an account? <a href="#" onclick="switchToLogin()">Login</a></p>
                    </form>
                </div>
            </div>

            <!-- Dashboard Page -->
            <div id="dashboard-page" class="page">
                <h1>Welcome to CodeRunner</h1>
                <p>Start coding in multiple languages with real-time execution</p>
            </div>

            <!-- Terminal Output -->
            <div class="terminal-output">
                <div class="terminal-header">Terminal</div>
                <div id="terminal" class="terminal-content"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
